[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealwatch"
version = "0.1.0"
description = "Config-driven price, stock and new-item notifier"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "protego>=0.3",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.40"]

[project.scripts]
dealwatch = "dealwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
